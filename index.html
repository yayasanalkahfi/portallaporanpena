<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Laporan Hasil Pena</title>
    <!-- React & ReactDOM (Stable 18) -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel untuk kompilasi JSX di Browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Tailwind CSS untuk Styling Modern -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PropTypes dependensi Recharts -->
    <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
    <!-- Recharts untuk Grafik Interaktif (Versi UMD Terpilih) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/recharts/2.12.7/Recharts.min.js"></script>
    <!-- Lucide Icons untuk Ikon Indah -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @media print {
            body { background: white !important; }
            nav, .no-print, .bg-slate-900 { display: none !important; }
            .print-only { display: block !important; }
            .page-break-inside-avoid { break-inside: avoid; }
            @page { size: A4 portrait; margin: 1cm; }
        }
        @media screen {
            .print-only { display: none; }
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect, useRef } = React;

        // URL WEB APP GOOGLE APPS SCRIPT ANDA
        const GAS_URL = "https://script.google.com/macros/s/AKfycbzhV5Y00du0rfREsmcqnt47T1z-aFHr04Sxmy5gxtvcJa93AGhw5tQIzeWkdZ_gcPeH/exec";

        function App() {
            const [activeTab, setActiveTab] = useState('dashboard');
            const [data, setData] = useState([]);
            const [isLoading, setIsLoading] = useState(false);
            const [filterMonth, setFilterMonth] = useState('all');
            const [filterYear, setFilterYear] = useState('all');
            const [isDetailOpen, setIsDetailOpen] = useState(false);
            const [selectedRecord, setSelectedRecord] = useState(null);
            const [isAddOpen, setIsAddOpen] = useState(false);
            const [printMode, setPrintMode] = useState('none');
            const [rechartsReady, setRechartsReady] = useState(false);

            // Verifikasi pemuatan library Recharts secara aman
            useEffect(() => {
                let attempts = 0;
                if (window.Recharts) {
                    setRechartsReady(true);
                } else {
                    const interval = setInterval(() => {
                        attempts++;
                        if (window.Recharts) {
                            setRechartsReady(true);
                            clearInterval(interval);
                        } else if (attempts > 100) { // Timeout setelah 10 detik
                            clearInterval(interval);
                            console.error("Gagal memuat pustaka grafik Recharts.");
                        }
                    }, 100);
                    return () => clearInterval(interval);
                }
            }, []);

            // Load Lucide Icons sesudah render
            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            }, [activeTab, isLoading, isAddOpen, isDetailOpen, rechartsReady]);

            const fetchData = async () => {
                setIsLoading(true);
                try {
                    const response = await fetch(GAS_URL);
                    const result = await response.json();
                    if (result.status === 'success') {
                        const sortedData = (result.data || []).sort((a, b) => {
                            const dateA = a.tanggal ? new Date(a.tanggal) : new Date(0);
                            const dateB = b.tanggal ? new Date(b.tanggal) : new Date(0);
                            return dateB - dateA;
                        });
                        setData(sortedData);
                    }
                } catch (error) {
                    console.error("Gagal mengambil data dari Google Sheets:", error);
                } finally {
                    setIsLoading(false);
                }
            };

            useEffect(() => {
                fetchData();
            }, []);

            // Logika filter interaktif yang aman terhadap format string / objek tanggal
            const filteredData = useMemo(() => {
                return data.filter(item => {
                    if (!item.tanggal) return false;
                    
                    const dateStr = item.tanggal.substring(0, 10).replace(/-/g, '/');
                    const dateObj = new Date(dateStr);
                    if (isNaN(dateObj.getTime())) return true; 

                    const matchYear = filterYear === 'all' || dateObj.getFullYear().toString() === filterYear;
                    const matchMonth = filterMonth === 'all' || (dateObj.getMonth() + 1).toString() === filterMonth;
                    return matchYear && matchMonth;
                });
            }, [data, filterMonth, filterYear]);

            const formatIDR = (num) => {
                const value = parseFloat(num) || 0;
                return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(value);
            };

            const handlePrint = (mode) => {
                setPrintMode(mode);
                setTimeout(() => {
                    window.print();
                    setPrintMode('none');
                }, 500);
            };

            // Menghitung data analitik untuk dashboard berdasarkan hasil filter aktif
            const analytics = useMemo(() => {
                let totalMakro = 0;
                let totalTransfer = 0;
                let totalTunai = 0;

                filteredData.forEach(item => {
                    const nominal = parseFloat(item.nominal) || 0;
                    totalMakro += nominal;
                    if (item.pembayaran && item.pembayaran.toLowerCase() === 'transfer') {
                        totalTransfer += nominal;
                    } else if (item.pembayaran && item.pembayaran.toLowerCase() === 'tunai') {
                        totalTunai += nominal;
                    }
                });

                return { totalMakro, totalTransfer, totalTunai };
            }, [filteredData]);

            if (!rechartsReady) {
                return (
                    <div className="flex h-screen flex-col items-center justify-center bg-slate-50 text-slate-600 font-sans">
                        <div className="p-4 rounded-xl bg-white border border-slate-200 shadow-sm flex items-center gap-3">
                            <div className="w-5 h-5 border-2 border-blue-600 border-t-transparent rounded-full animate-spin"></div>
                            <span className="font-medium">Menginisialisasi pustaka visualisasi grafik...</span>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen">
                    {/* NAVIGASI (Sembunyi saat cetak) */}
                    {printMode === 'none' && (
                        <nav className="bg-slate-900 text-white p-4 shadow-md sticky top-0 z-40">
                            <div className="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
                                <div className="flex items-center gap-3">
                                    <div className="bg-blue-600 p-2 rounded-lg text-white">
                                        <i data-lucide="wallet" className="w-6 h-6"></i>
                                    </div>
                                    <h1 className="text-xl font-bold tracking-wide">Portal Laporan Hasil Pena</h1>
                                </div>
                                <div className="flex items-center gap-4">
                                    {isLoading && (
                                        <span className="text-sm text-slate-400 flex items-center gap-2">
                                            <i data-lucide="loader-2" className="w-4 h-4 animate-spin"></i> Memproses data...
                                        </span>
                                    )}
                                    <div className="flex bg-slate-800 rounded-lg p-1">
                                        <button 
                                            onClick={() => setActiveTab('dashboard')}
                                            className={`flex items-center gap-2 px-4 py-2 rounded-md transition-all ${activeTab === 'dashboard' ? 'bg-blue-600 text-white shadow' : 'text-slate-300 hover:text-white'}`}
                                        >
                                            <i data-lucide="home" className="w-4.5 h-4.5"></i> Dashboard
                                        </button>
                                        <button 
                                            onClick={() => setActiveTab('rekap')}
                                            className={`flex items-center gap-2 px-4 py-2 rounded-md transition-all ${activeTab === 'rekap' ? 'bg-blue-600 text-white shadow' : 'text-slate-300 hover:text-white'}`}
                                        >
                                            <i data-lucide="table-2" className="w-4.5 h-4.5"></i> Master Rekap
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </nav>
                    )}

                    {/* MAIN VIEW */}
                    <main className={`max-w-7xl mx-auto p-4 md:p-6 ${printMode !== 'none' ? 'hidden' : 'block'}`}>
                        {/* GLOBAL FILTERS */}
                        <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-200 mb-6 flex flex-wrap gap-4 items-end justify-between">
                            <div className="flex gap-4 flex-wrap">
                                <div>
                                    <label className="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Tahun</label>
                                    <select value={filterYear} onChange={e => setFilterYear(e.target.value)} className="border border-slate-300 rounded-lg px-3 py-2 bg-slate-50 text-slate-700 outline-none focus:ring-2 focus:ring-blue-500">
                                        <option value="all">Sepanjang Tahun</option>
                                        <option value="2026">2026</option>
                                        <option value="2025">2025</option>
                                    </select>
                                </div>
                                <div>
                                    <label className="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Bulan</label>
                                    <select value={filterMonth} onChange={e => setFilterMonth(e.target.value)} className="border border-slate-300 rounded-lg px-3 py-2 bg-slate-50 text-slate-700 outline-none focus:ring-2 focus:ring-blue-500">
                                        <option value="all">Semua Bulan</option>
                                        <option value="1">Januari</option>
                                        <option value="2">Februari</option>
                                        <option value="3">Maret</option>
                                        <option value="4">April</option>
                                        <option value="5">Mei</option>
                                        <option value="6">Juni</option>
                                        <option value="7">Juli</option>
                                        <option value="8">Agustus</option>
                                        <option value="9">September</option>
                                        <option value="10">Oktober</option>
                                        <option value="11">November</option>
                                        <option value="12">Desember</option>
                                    </select>
                                </div>
                                <div className="flex items-end">
                                    <button onClick={fetchData} className="text-sm text-blue-600 hover:text-blue-800 underline pb-2 font-medium">SINKRONKAN DATA</button>
                                </div>
                            </div>
                            
                            {/* TOMBOL AKSI */}
                            <div className="flex gap-2 flex-wrap">
                                {activeTab === 'dashboard' ? (
                                    <>
                                        <button onClick={() => handlePrint('dashboard')} className="flex items-center gap-2 bg-slate-800 hover:bg-slate-900 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors">
                                            <i data-lucide="printer" className="w-4 h-4"></i> Cetak Dashboard
                                        </button>
                                    </>
                                ) : (
                                    <div className="flex flex-wrap gap-2 justify-end">
                                        <button onClick={() => {
                                            const headers = ['Tanggal', 'Nama', 'Alamat', 'Produk', 'Pembayaran', 'Nominal', 'Kode Transaksi', 'Fee(%)', 'Nominal Fee'];
                                            const csvContent = filteredData.map(r => [
                                                r.tanggal,
                                                `"${r.nama || ''}"`,
                                                `"${r.alamat || ''}"`,
                                                `"${r.produk || ''}"`,
                                                r.pembayaran || '',
                                                r.nominal || 0,
                                                r.kodetransaksi || '',
                                                r.persentasefee || 0,
                                                r.nominalfee || 0
                                            ].join(','));
                                            const blob = new Blob([headers.join(',') + '\n' + csvContent.join('\n')], { type: 'text/csv;charset=utf-8;' });
                                            const url = URL.createObjectURL(blob);
                                            const link = document.createElement("a");
                                            link.setAttribute("href", url);
                                            link.setAttribute("download", `Rekap_Pena_${filterYear}_${filterMonth}.csv`);
                                            document.body.appendChild(link);
                                            link.click();
                                            document.body.removeChild(link);
                                        }} className="flex items-center gap-2 bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-2 rounded-lg text-sm font-medium">
                                            <i data-lucide="file-spreadsheet" className="w-4 h-4"></i> Export CSV
                                        </button>
                                        <button onClick={() => handlePrint('tabel')} className="flex items-center gap-2 bg-slate-100 hover:bg-slate-200 text-slate-700 border border-slate-300 px-3 py-2 rounded-lg text-sm font-medium">
                                            <i data-lucide="printer" className="w-4 h-4"></i> Cetak Tabel
                                        </button>
                                        <button onClick={() => handlePrint('buktiPerawatan')} className="flex items-center gap-2 bg-slate-100 hover:bg-slate-200 text-slate-700 border border-slate-300 px-3 py-2 rounded-lg text-sm font-medium">
                                            <i data-lucide="image" className="w-4 h-4"></i> Cetak Bukti Perawatan
                                        </button>
                                        <button onClick={() => handlePrint('buktiTransfer')} className="flex items-center gap-2 bg-slate-100 hover:bg-slate-200 text-slate-700 border border-slate-300 px-3 py-2 rounded-lg text-sm font-medium">
                                            <i data-lucide="receipt" className="w-4 h-4"></i> Cetak Bukti Transfer
                                        </button>
                                        <button onClick={() => setIsAddOpen(true)} className="flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-medium shadow-md">
                                            <i data-lucide="plus" className="w-4 h-4"></i> Tambah Record
                                        </button>
                                    </div>
                                )}
                            </div>
                        </div>

                        {/* TAB DASHBOARD */}
                        {activeTab === 'dashboard' ? (
                            <DashboardView filteredData={filteredData} analytics={analytics} formatIDR={formatIDR} />
                        ) : (
                            /* TAB REKAP */
                            <MasterRekapView 
                                data={filteredData} 
                                formatIDR={formatIDR} 
                                onRowClick={(record) => { setSelectedRecord(record); setIsDetailOpen(true); }}
                            />
                        )}
                    </main>

                    {/* DETAIL MODAL */}
                    {isDetailOpen && selectedRecord && (
                        <DetailModal record={selectedRecord} formatIDR={formatIDR} onClose={() => setIsDetailOpen(false)} />
                    )}

                    {/* INPUT MODAL DENGAN AUTO-KOMPRESI */}
                    {isAddOpen && (
                        <AddRecordModal 
                            onClose={() => setIsAddOpen(false)} 
                            onAddSuccess={fetchData} 
                            products={[...new Set(data.map(item => item.produk).filter(Boolean))]}
                        />
                    )}

                    {/* LAYOUT PRINT BULK UNTUK CETAK */}
                    {printMode === 'dashboard' && (
                        <div className="print-only p-8">
                            <h1 className="text-2xl font-bold mb-6 text-center">Laporan Analitik Hasil Pena</h1>
                            <DashboardView filteredData={filteredData} analytics={analytics} formatIDR={formatIDR} isPrint={true} />
                        </div>
                    )}

                    {printMode === 'tabel' && (
                        <div className="print-only p-4">
                            <h2 className="text-xl font-bold mb-4 text-center">Rekap Hasil Pena</h2>
                            <table className="w-full border-collapse border border-slate-300 text-xs">
                                <thead>
                                    <tr className="bg-slate-100">
                                        <th className="border p-2">Tanggal</th>
                                        <th className="border p-2">Nama & Alamat</th>
                                        <th className="border p-2">Produk</th>
                                        <th className="border p-2">Pembayaran</th>
                                        <th className="border p-2">Nominal</th>
                                        <th className="border p-2">Kode Trx</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {filteredData.map((row, i) => (
                                        <tr key={i}>
                                            <td className="border p-2">{row.tanggal}</td>
                                            <td className="border p-2 font-semibold">{row.nama}<br/><span className="font-normal text-slate-500 text-[10px]">{row.alamat}</span></td>
                                            <td className="border p-2">{row.produk}</td>
                                            <td className="border p-2">{row.pembayaran}</td>
                                            <td className="border p-2">{formatIDR(row.nominal)}</td>
                                            <td className="border p-2 font-mono">{row.kodetransaksi}</td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    )}

                    {(printMode === 'buktiPerawatan' || printMode === 'buktiTransfer') && (
                        <div className="print-only p-4">
                            <div className="grid grid-cols-2 gap-6">
                                {filteredData
                                    .filter(item => printMode === 'buktiPerawatan' ? item.buktiperawatan : item.buktitransfer)
                                    .map((item, idx) => (
                                        <div key={idx} className="border-2 border-slate-800 rounded-xl p-4 flex flex-col items-center page-break-inside-avoid shadow-sm">
                                            <h3 className="font-bold text-sm mb-3 tracking-wide text-center uppercase border-b w-full pb-2 text-slate-800">
                                                {printMode === 'buktiPerawatan' ? 'BUKTI PERAWATAN' : 'BUKTI TRANSFER'}
                                            </h3>
                                            <div className="w-full relative bg-slate-100 rounded-lg overflow-hidden border border-slate-300" style={{ paddingBottom: '177.77%' }}>
                                                <img 
                                                    src={printMode === 'buktiPerawatan' ? item.buktiperawatan : item.buktitransfer} 
                                                    alt="Lampiran Gambar" 
                                                    className="absolute inset-0 w-full h-full object-cover shrink-0"
                                                />
                                            </div>
                                            <div className="w-full mt-4 text-xs space-y-1.5 text-slate-700">
                                                <p><strong>Nama:</strong> {item.nama}</p>
                                                <p><strong>Alamat:</strong> {item.alamat}</p>
                                                <p className="pt-2 border-t border-dashed border-slate-400 font-mono text-slate-800">
                                                    <strong>Kode TRX:</strong> {item.kodetransaksi}
                                                </p>
                                            </div>
                                        </div>
                                    ))
                                }
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // --- DASHBOARD SUB-VIEW ---
        function DashboardView({ filteredData, analytics, formatIDR, isPrint = false }) {
            const { BarChart, Bar, XAxis, YAxis, Tooltip, ResponsiveContainer, LineChart, Line, CartesianGrid, Legend } = window.Recharts;
            const chartData = useMemo(() => {
                const months = {};
                filteredData.forEach(item => {
                    if (!item.tanggal) return;
                    const mKey = item.tanggal.substring(0, 7); 
                    if (!months[mKey]) months[mKey] = { name: mKey, Makro: 0, Transfer: 0, Tunai: 0 };
                    
                    const nominal = parseFloat(item.nominal) || 0;
                    months[mKey].Makro += nominal;
                    if (item.pembayaran && item.pembayaran.toLowerCase() === 'transfer') months[mKey].Transfer += nominal;
                    if (item.pembayaran && item.pembayaran.toLowerCase() === 'tunai') months[mKey].Tunai += nominal;
                });
                return Object.values(months).sort((a, b) => a.name.localeCompare(b.name));
            }, [filteredData]);

            const productData = useMemo(() => {
                const prods = {};
                filteredData.forEach(item => {
                    if (!item.produk) return;
                    if (!prods[item.produk]) prods[item.produk] = { name: item.produk, Total: 0 };
                    prods[item.produk].Total += parseFloat(item.nominal) || 0;
                });
                return Object.values(prods).sort((a, b) => b.Total - a.Total).slice(0, 5);
            }, [filteredData]);

            return (
                <div className="space-y-6">
                    {/* STATS CARDS */}
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div className="bg-white p-5 rounded-xl shadow-sm border border-slate-200 border-l-4 border-l-blue-600 flex items-center gap-4">
                            <div className="bg-blue-100 p-3 rounded-full text-blue-600"><i data-lucide="wallet" className="w-6 h-6"></i></div>
                            <div>
                                <p className="text-xs text-slate-500 font-medium uppercase tracking-wider">Hasil Makro</p>
                                <p className="text-xl font-bold text-slate-800">{formatIDR(analytics.totalMakro)}</p>
                            </div>
                        </div>
                        <div className="bg-white p-5 rounded-xl shadow-sm border border-slate-200 border-l-4 border-l-emerald-500 flex items-center gap-4">
                            <div className="bg-emerald-100 p-3 rounded-full text-emerald-600"><i data-lucide="landmark" className="w-6 h-6"></i></div>
                            <div>
                                <p className="text-xs text-slate-500 font-medium uppercase tracking-wider">Hasil Transfer</p>
                                <p className="text-xl font-bold text-slate-800">{formatIDR(analytics.totalTransfer)}</p>
                            </div>
                        </div>
                        <div className="bg-white p-5 rounded-xl shadow-sm border border-slate-200 border-l-4 border-l-amber-500 flex items-center gap-4">
                            <div className="bg-amber-100 p-3 rounded-full text-amber-600"><i data-lucide="receipt" className="w-6 h-6"></i></div>
                            <div>
                                <p className="text-xs text-slate-500 font-medium uppercase tracking-wider">Hasil Tunai</p>
                                <p className="text-xl font-bold text-slate-800">{formatIDR(analytics.totalTunai)}</p>
                            </div>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        {/* CHART TREND */}
                        <div className="lg:col-span-2 bg-white p-5 rounded-xl border border-slate-200">
                            <h3 className="font-bold text-slate-800 mb-4 flex items-center gap-2">
                                <i data-lucide="trending-up" className="text-blue-600 w-5 h-5"></i> Trendline Hasil Pena
                            </h3>
                            <div className="h-72">
                                {chartData.length > 0 ? (
                                    <ResponsiveContainer width="100%" height="100%">
                                        <LineChart data={chartData}>
                                            <CartesianGrid strokeDasharray="3 3" />
                                            <XAxis dataKey="name" />
                                            <YAxis tickFormatter={v => `Rp${(v/1000000).toFixed(1)}jt`} />
                                            <Tooltip formatter={v => formatIDR(v)} />
                                            <Legend />
                                            <Line type="monotone" dataKey="Makro" stroke="#2563eb" strokeWidth={3} />
                                            <Line type="monotone" dataKey="Transfer" stroke="#10b981" />
                                            <Line type="monotone" dataKey="Tunai" stroke="#f59e0b" />
                                        </LineChart>
                                    </ResponsiveContainer>
                                ) : (
                                    <div className="h-full flex items-center justify-center text-slate-400">Tidak ada data untuk grafik trend.</div>
                                )}
                            </div>
                        </div>

                        {/* CHART TERLARIS */}
                        <div className="bg-white p-5 rounded-xl border border-slate-200">
                            <h3 className="font-bold text-slate-800 mb-4">Produk Terlaris</h3>
                            <div className="h-72">
                                {productData.length > 0 ? (
                                    <ResponsiveContainer width="100%" height="100%">
                                        <BarChart data={productData} layout="vertical">
                                            <CartesianGrid strokeDasharray="3 3" />
                                            <XAxis type="number" hide />
                                            <YAxis dataKey="name" type="category" width={100} tick={{ fontSize: 10 }} />
                                            <Tooltip formatter={v => formatIDR(v)} />
                                            <Bar dataKey="Total" fill="#6366f1" radius={[0, 4, 4, 0]} />
                                        </BarChart>
                                    </ResponsiveContainer>
                                ) : (
                                    <div className="h-full flex items-center justify-center text-slate-400">Tidak ada data produk.</div>
                                )}
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // --- MASTER REKAP TABLE ---
        function MasterRekapView({ data, formatIDR, onRowClick }) {
            return (
                <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                    <div className="overflow-x-auto custom-scrollbar">
                        <table className="w-full text-left text-sm whitespace-nowrap">
                            <thead className="bg-slate-50 border-b border-slate-200 text-slate-600 font-semibold">
                                <tr>
                                    <th className="px-6 py-4">Tanggal & TRX</th>
                                    <th className="px-6 py-4">Nama & Alamat</th>
                                    <th className="px-6 py-4">Produk</th>
                                    <th className="px-6 py-4">Pembayaran & Nominal</th>
                                    <th className="px-6 py-4">Nominal Fee</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-slate-100">
                                {data.length === 0 ? (
                                    <tr>
                                        <td colSpan="5" className="text-center py-16 text-slate-400">
                                            <div className="flex flex-col items-center gap-2">
                                                <i data-lucide="folder-open" className="w-10 h-10 text-slate-300"></i>
                                                <span>Belum ada data pada periode ini.</span>
                                            </div>
                                        </td>
                                    </tr>
                                ) : (
                                    data.map((row, idx) => (
                                        <tr key={idx} onClick={() => onRowClick(row)} className="hover:bg-blue-50/50 cursor-pointer transition-colors">
                                            <td className="px-6 py-4">
                                                <p className="font-medium text-slate-800">{row.tanggal}</p>
                                                <p className="font-mono text-xs text-slate-400 mt-0.5">{row.kodetransaksi}</p>
                                            </td>
                                            <td className="px-6 py-4">
                                                <p className="font-semibold text-slate-800">{row.nama}</p>
                                                <p className="text-xs text-slate-500 truncate max-w-xs">{row.alamat}</p>
                                            </td>
                                            <td className="px-6 py-4 font-medium text-slate-700">{row.produk}</td>
                                            <td className="px-6 py-4">
                                                <span className={`inline-block px-2 py-0.5 rounded text-[10px] font-bold uppercase tracking-wider mb-1 ${row.pembayaran === 'Transfer' ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'}`}>
                                                    {row.pembayaran}
                                                </span>
                                                <p className="font-bold text-slate-900">{formatIDR(row.nominal)}</p>
                                            </td>
                                            <td className="px-6 py-4">
                                                <p className="font-semibold text-slate-800">{formatIDR(row.nominalfee)}</p>
                                                <p className="text-xs text-slate-400 mt-0.5">Fee: {row.persentasefee}%</p>
                                            </td>
                                        </tr>
                                    ))
                                )}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        }

        // --- DETAIL DATA MODAL ---
        function DetailModal({ record, formatIDR, onClose }) {
            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm">
                    <div className="bg-white rounded-2xl w-full max-w-3xl max-h-[90vh] flex flex-col shadow-2xl animate-in fade-in duration-200">
                        <div className="px-6 py-4 border-b flex justify-between items-center bg-slate-50 rounded-t-2xl">
                            <h2 className="text-lg font-bold">Detail Record: {record.kodetransaksi}</h2>
                            <button onClick={onClose} className="p-1 hover:bg-slate-200 rounded-full transition-colors"><i data-lucide="x"></i></button>
                        </div>
                        <div className="p-6 overflow-y-auto flex-1 custom-scrollbar">
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                <div className="space-y-3 text-sm">
                                    <div><span className="text-slate-400 font-medium">Tanggal</span><p className="text-slate-800 font-semibold">{record.tanggal}</p></div>
                                    <div><span className="text-slate-400 font-medium">Nama Pelanggan</span><p className="text-slate-800 font-semibold">{record.nama}</p></div>
                                    <div><span className="text-slate-400 font-medium">Alamat</span><p className="text-slate-800 font-semibold">{record.alamat}</p></div>
                                    <div><span className="text-slate-400 font-medium">Produk</span><p className="text-slate-800 font-semibold">{record.produk}</p></div>
                                    <div><span className="text-slate-400 font-medium">Nominal Transaksi</span><p className="text-blue-600 font-bold text-base">{formatIDR(record.nominal)} ({record.pembayaran})</p></div>
                                    <div className="grid grid-cols-2 gap-2 border-t pt-2">
                                        <div><span className="text-slate-400 font-medium">Fee %</span><p className="text-slate-800 font-semibold">{record.persentasefee}%</p></div>
                                        <div><span className="text-slate-400 font-medium">Nominal Fee</span><p className="text-slate-800 font-semibold">{formatIDR(record.nominalfee)}</p></div>
                                    </div>
                                </div>
                                <div className="space-y-4">
                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <span className="text-xs font-semibold text-slate-500 uppercase tracking-wider block mb-2">Bukti Perawatan</span>
                                            {record.buktiperawatan ? (
                                                <a href={record.buktiperawatan} target="_blank" rel="noreferrer" className="block relative aspect-[9/16] rounded-xl overflow-hidden border">
                                                    <img src={record.buktiperawatan} alt="Bukti Perawatan" className="absolute inset-0 w-full h-full object-cover" />
                                                </a>
                                            ) : <div className="border border-dashed h-48 rounded-xl flex items-center justify-center text-xs text-slate-400">Tidak ada foto</div>}
                                        </div>
                                        <div>
                                            <span className="text-xs font-semibold text-slate-500 uppercase tracking-wider block mb-2">Bukti Transfer</span>
                                            {record.buktitransfer ? (
                                                <a href={record.buktitransfer} target="_blank" rel="noreferrer" className="block relative aspect-[9/16] rounded-xl overflow-hidden border">
                                                    <img src={record.buktitransfer} alt="Bukti Transfer" className="absolute inset-0 w-full h-full object-cover" />
                                                </a>
                                            ) : <div className="border border-dashed h-48 rounded-xl flex items-center justify-center text-xs text-slate-400">Tidak ada foto</div>}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div className="px-6 py-4 border-t bg-slate-50 rounded-b-2xl flex justify-end gap-2">
                            <button onClick={() => alert("Gunakan panel spreadsheet utama untuk mengubah data ini.")} className="px-4 py-2 bg-amber-500 hover:bg-amber-600 text-white rounded-lg font-bold">Edit</button>
                            <button onClick={onClose} className="px-4 py-2 bg-slate-800 hover:bg-slate-900 text-white rounded-lg font-bold">Tutup</button>
                        </div>
                    </div>
                </div>
            );
        }

        // --- TAMBAH RECORD MODAL DENGAN PENGECIL GAMBAR OTOMATIS (Mencegah Crash Drive) ---
        function AddRecordModal({ onClose, onAddSuccess, products }) {
            const [isSubmitting, setIsSubmitting] = useState(false);
            const [productList, setProductList] = useState(products.length ? products : ['Pena Parker', 'Pena Montblanc', 'Pena Lamy']);
            const [newProduct, setNewProduct] = useState('');

            const getInitialState = () => ({
                tanggal: new Date().toISOString().split('T')[0],
                nama: '', alamat: '', produk: productList[0] || '', pembayaran: 'Transfer',
                nominal: '', kodeTransaksi: `TRX-${Date.now().toString().slice(-6)}`,
                persentaseFee: '', nominalFee: '', fileTransfer: null, filePerawatan: null
            });

            const [formData, setFormData] = useState(getInitialState());
            const [previewTf, setPreviewTf] = useState(null);
            const [previewPr, setPreviewPr] = useState(null);

            const handleCalc = (nom, fee) => {
                setFormData(prev => ({ 
                    ...prev, 
                    nominal: nom, 
                    persentaseFee: fee, 
                    nominalFee: (nom && fee) ? (parseFloat(nom) * parseFloat(fee)) / 100 : '' 
                }));
            };

            const compressFile = (file) => {
                return new Promise((resolve, reject) => {
                    if (!file) return resolve(null);
                    const reader = new FileReader();
                    reader.readAsDataURL(file);
                    reader.onload = (e) => {
                        const img = new Image();
                        img.src = e.target.result;
                        img.onload = () => {
                            const canvas = document.createElement('canvas');
                            const max_size = 800; // resolusi optimal untuk hemat kuota dan tidak crash di GAS
                            let width = img.width;
                            let height = img.height;

                            if (width > height) {
                                if (width > max_size) { height *= max_size / width; width = max_size; }
                            } else {
                                if (height > max_size) { width *= max_size / height; height = max_size; }
                            }
                            canvas.width = width;
                            canvas.height = height;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0, width, height);
                            resolve(canvas.toDataURL('image/jpeg', 0.6));
                        };
                    };
                    reader.onerror = (err) => reject(err);
                });
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                setIsSubmitting(true);
                try {
                    const base64Transfer = await compressFile(formData.fileTransfer);
                    const base64Perawatan = await compressFile(formData.filePerawatan);

                    const payload = {
                        ...formData,
                        buktiTransferBase64: base64Transfer,
                        buktiPerawatanBase64: base64Perawatan
                    };

                    const response = await fetch(GAS_URL, {
                        method: 'POST',
                        body: JSON.stringify(payload)
                    });

                    const res = await response.json();
                    if (res.status === 'success') {
                        alert("Data Sukses Tersimpan ke Drive dan Sheet!");
                        onAddSuccess();
                        setFormData(getInitialState());
                        setPreviewTf(null);
                        setPreviewPr(null);
                    } else {
                        alert("Gagal: " + res.message);
                    }
                } catch (err) {
                    alert("Gagal melakukan upload. Coba bersihkan file atau gunakan gambar berukuran kecil.");
                } finally {
                    setIsSubmitting(false);
                }
            };

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm">
                    <div className="bg-white rounded-2xl w-full max-w-3xl max-h-[95vh] flex flex-col shadow-2xl">
                        <div className="px-6 py-4 border-b bg-blue-600 text-white rounded-t-2xl flex justify-between items-center">
                            <h2 className="font-bold flex items-center gap-2">Tambah Record Baru</h2>
                            <button onClick={onClose} disabled={isSubmitting} className="hover:bg-blue-700 p-1 rounded-full"><i data-lucide="x"></i></button>
                        </div>
                        <div className="p-6 overflow-y-auto flex-1 custom-scrollbar">
                            <form id="addForm" onSubmit={handleSubmit} className="space-y-4">
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <div className="space-y-3">
                                        <div><label className="text-xs font-bold block text-slate-600 mb-1">Tanggal</label><input type="date" required value={formData.tanggal} onChange={e => setFormData({...formData, tanggal: e.target.value})} className="w-full border p-2 rounded" /></div>
                                        <div><label className="text-xs font-bold block text-slate-600 mb-1">Nama</label><input type="text" required value={formData.nama} onChange={e => setFormData({...formData, nama: e.target.value})} className="w-full border p-2 rounded" /></div>
                                        <div><label className="text-xs font-bold block text-slate-600 mb-1">Alamat</label><textarea required value={formData.alamat} onChange={e => setFormData({...formData, alamat: e.target.value})} className="w-full border p-2 rounded" rows="2" /></div>
                                        <div>
                                            <label className="text-xs font-bold block text-slate-600 mb-1">Produk</label>
                                            <select value={formData.produk} onChange={e => setFormData({...formData, produk: e.target.value})} className="w-full border p-2 rounded mb-2">
                                                {productList.map(p => <option key={p} value={p}>{p}</option>)}
                                            </select>
                                            <div className="flex gap-2">
                                                <input type="text" value={newProduct} onChange={e => setNewProduct(e.target.value)} placeholder="Tulis produk baru..." className="border p-1.5 text-xs rounded flex-1" />
                                                <button type="button" onClick={() => {
                                                    if (newProduct && !productList.includes(newProduct)) {
                                                        setProductList([...productList, newProduct]);
                                                        setFormData({...formData, produk: newProduct});
                                                        setNewProduct('');
                                                    }
                                                }} className="bg-slate-200 text-xs px-3 rounded font-bold">Tambah</button>
                                            </div>
                                        </div>
                                    </div>
                                    <div className="space-y-3">
                                        <div>
                                            <label className="text-xs font-bold block text-slate-600 mb-1">Pembayaran</label>
                                            <div className="flex gap-4 p-2 bg-slate-50 border rounded">
                                                <label className="flex items-center gap-1 cursor-pointer"><input type="radio" name="pay" checked={formData.pembayaran === 'Transfer'} onChange={() => setFormData({...formData, pembayaran: 'Transfer'})} /> Transfer</label>
                                                <label className="flex items-center gap-1 cursor-pointer"><input type="radio" name="pay" checked={formData.pembayaran === 'Tunai'} onChange={() => setFormData({...formData, pembayaran: 'Tunai'})} /> Tunai</label>
                                            </div>
                                        </div>
                                        <div><label className="text-xs font-bold block text-slate-600 mb-1">Nominal (IDR)</label><input type="number" required value={formData.nominal} onChange={e => handleCalc(e.target.value, formData.persentaseFee)} className="w-full border p-2 rounded font-mono" /></div>
                                        <div className="grid grid-cols-2 gap-2">
                                            <div><label className="text-xs font-bold block text-slate-600 mb-1">Fee (%)</label><input type="number" required value={formData.persentaseFee} onChange={e => handleCalc(formData.nominal, e.target.value)} className="w-full border p-2 rounded font-mono" /></div>
                                            <div><label className="text-xs font-bold block text-slate-600 mb-1">Nominal Fee</label><input type="text" readOnly value={formData.nominalFee} className="w-full border p-2 rounded font-mono bg-slate-100" /></div>
                                        </div>
                                        <div><label className="text-xs font-bold block text-slate-600 mb-1">Kode Transaksi</label><input type="text" value={formData.kodeTransaksi} readOnly className="w-full border p-2 rounded font-mono text-xs bg-slate-100" /></div>
                                    </div>
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4 border-t pt-4">
                                    <div>
                                        <label className="text-xs font-bold block text-slate-600 mb-1">Foto Bukti Transfer</label>
                                        <input type="file" accept="image/*" onChange={e => {
                                            const file = e.target.files[0];
                                            if (file) {
                                                setPreviewTf(URL.createObjectURL(file));
                                                setFormData({...formData, fileTransfer: file});
                                            }
                                        }} className="text-xs w-full" />
                                        {previewTf && <img src={previewTf} className="mt-2 h-20 rounded border object-cover" />}
                                    </div>
                                    <div>
                                        <label className="text-xs font-bold block text-slate-600 mb-1">Foto Bukti Perawatan (Wajib)</label>
                                        <input type="file" required accept="image/*" onChange={e => {
                                            const file = e.target.files[0];
                                            if (file) {
                                                setPreviewPr(URL.createObjectURL(file));
                                                setFormData({...formData, filePerawatan: file});
                                            }
                                        }} className="text-xs w-full" />
                                        {previewPr && <img src={previewPr} className="mt-2 h-20 rounded border object-cover" />}
                                    </div>
                                </div>
                            </form>
                        </div>
                        <div className="px-6 py-4 border-t bg-slate-50 flex justify-end gap-2">
                            <button type="button" onClick={onClose} disabled={isSubmitting} className="px-4 py-2 bg-slate-200 rounded-lg text-sm font-bold">Batal / Tutup</button>
                            <button type="submit" form="addForm" disabled={isSubmitting} className="px-4 py-2 bg-blue-600 text-white rounded-lg text-sm font-bold">
                                {isSubmitting ? "Sedang Mengirim..." : "Simpan Data"}
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
